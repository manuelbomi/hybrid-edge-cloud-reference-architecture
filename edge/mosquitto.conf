# Minimal Mosquitto config for the local demo stack.
#
# Anonymous access is fine here because this broker only exists inside
# the docker-compose network for a local demo. A real deployment would
# add authentication (username/password or client certificates) and TLS
# -- see the "Limitations & production hardening notes" section of the
# top-level README.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
