name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        id: setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
        continue-on-error: true

      - name: terraform fmt -check
        if: steps.setup.outcome == 'success'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, validate only)
        if: steps.setup.outcome == 'success'
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: terraform validate
        if: steps.setup.outcome == 'success'
        working-directory: infra/terraform
        run: terraform validate

      - name: Manual HCL check note
        if: steps.setup.outcome != 'success'
        run: |
          echo "Terraform setup action was unavailable in this runner."
          echo "Manual check required: run 'terraform fmt -check -recursive' and"
          echo "'terraform validate' (after 'terraform init -backend=false') inside"
          echo "infra/terraform/ locally, or in any environment with Terraform installed."
